#
# Dependabot version updates, held to the workspace's 7-day release cooldown
# (NFR-WC-15; D-CG-12; Q-CG-1 A). Each update PR still has to pass CI: the
# register, licence, and configuration checks, and the frozen-lockfile install.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # The pinned images (D-CG-OI-10; NFR-OI-26): the build and run stages of
  # all four service Dockerfiles, S1 to S4, here, and the stores, in the
  # Compose file below. The four share one build pin and one runtime pin
  # (deploy/test/base-image-pin.test.ts), so the group puts every directory's
  # update into one pull request, which moves all four together.
  - package-ecosystem: docker
    directories:
      - /services/org-gateway
      - /services/control-gateway
      - /services/data-gateway
      - /services/event-ingest
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      service-base-images:
        patterns:
          - '*'

  # A postgres bump here needs the companion edit by hand: the same reference
  # in ci.yml's test database service and db-test.ts's POSTGRES_IMAGE, which
  # Dependabot cannot update. deploy/test/postgres-pin.test.ts enforces it.
  - package-ecosystem: docker-compose
    directory: /deploy/local
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
