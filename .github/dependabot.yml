#
# Dependabot version updates, held to the workspace's 7-day release cooldown
# (NFR-WC-15; D-CG-12; Q-CG-1 A). Each update PR still has to pass CI: the
# register, licence, and configuration checks, and the frozen-lockfile install.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # The pinned images (D-CG-OI-10; NFR-OI-26): the S1 build and run stages,
  # in the Dockerfile, and the org store, in the Compose file.
  - package-ecosystem: docker
    directory: /services/org-gateway
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /deploy/local
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
