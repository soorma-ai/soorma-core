# SPDX-License-Identifier: FSL-1.1-ALv2
#
# soorma-core CI (T-14; NFR-WC-12, 17, 18, 20; M1-TECH-04; SECURITY-10, 13).
# Every action is pinned by commit SHA, with its release tag in a comment.
# Permissions default to read-only; no job widens them.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, check, and test
    runs-on: ubuntu-24.04
    # The package and service tests' database (Q-CG-2 A; D-CG-OI-15): the same
    # pinned PostgreSQL as the stack, without TLS. The harness creates the
    # roles from deploy/local/db/roles.sql and migrates as the migrator; tests
    # connect as the app role. The password is a throwaway for this container
    # on the runner's loopback; TLS to the store is checked by the stack smoke
    # test below.
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_PASSWORD: ci-throwaway-test-database
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-throwaway-test-database@127.0.0.1:5432/postgres
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm at the exact version package.json's packageManager names; no Corepack.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check the workspace configuration, register, and licences
        run: pnpm run check:deps

      - name: Check the workflows
        run: pnpm run check:workflows

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Check the SQL, secret comparisons, and injection tokens
        run: pnpm run check:code

      - name: Check the repository for secrets
        run: pnpm run check:secrets

      - name: Check the breached list against its manifest
        run: pnpm run check:breached

      - name: Check the generated types are current
        run: pnpm run check:generated

      - name: Contract checks
        run: pnpm run check:contract

      - name: Test
        run: pnpm test
        env:
          # The service's container, for the restore round trip's pg_dump and
          # pg_restore (U5 D-CG-AR-04). The job context exists in a step's env,
          # not in the job's.
          TEST_DATABASE_CONTAINER: ${{ job.services.postgres.id }}

      - name: Audit dependencies (moderate and above fail)
        run: pnpm audit --audit-level moderate

      - name: Prepare the SBOM directory
        run: mkdir -p sbom

      - name: Generate the SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom/soorma-core.cdx.json
          upload-artifact: false

      - name: Keep the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom/soorma-core.cdx.json
          if-no-files-found: error

  image-and-stack:
    name: Images, image secret scans, stack smoke test, and the S1-stopped demonstration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build the S1 image
        run: docker build -f services/org-gateway/Dockerfile -t soorma/org-gateway:local .

      - name: Check the image's file system for secrets
        run: node tools/checks/run.ts secrets --image soorma/org-gateway:local

      # U6 NP-AC-10 (TC-AC-083): the positive control. S1 links P10, so the
      # installed-packages check must find it here, or it proves nothing.
      - name: Check the S1 image holds @soorma/org-identity (the positive control)
        run: node tools/checks/run.ts image-packages --image soorma/org-gateway:local --expect @soorma/org-identity

      # U4 Infrastructure Design §2, §12; TC-EHA-088.
      - name: Build the S2 image
        run: docker build -f services/control-gateway/Dockerfile -t soorma/control-gateway:local .

      - name: Check the S2 image's file system for secrets
        run: node tools/checks/run.ts secrets --image soorma/control-gateway:local

      # U6 NP-AC-10, the user's addition (TC-AC-083): S2's installed packages
      # hold no organization-level code. S2's manifest test is unchanged.
      - name: Check the S2 image's installed packages
        run: node tools/checks/run.ts image-packages --image soorma/control-gateway:local --forbid @soorma/org-identity

      # U6 Infrastructure Design §3, §17 (D-ID-AC-01, 18; TC-AC-083): S3's image,
      # its secret scan, and its installed packages: no organization-level code,
      # no human identity resolution, no evaluator, and no migrations.
      - name: Build the S3 image
        run: docker build -f services/data-gateway/Dockerfile -t soorma/data-gateway:local .

      - name: Check the S3 image's file system for secrets
        run: node tools/checks/run.ts secrets --image soorma/data-gateway:local

      - name: Check the S3 image's installed packages
        run: node tools/checks/run.ts image-packages --image soorma/data-gateway:local --forbid @soorma/org-identity,@soorma/identity-resolution,@soorma/authority

      - name: Check the S3 image ships no migrations
        run: |
          id=$(docker create soorma/data-gateway:local)
          if docker export "$id" | tar -t | grep -E 'env-store/migrations/'; then
            echo "S3's image holds env-store's migrations"; exit 1
          fi
          docker rm "$id" > /dev/null

      # Throwaway secrets for this run only, generated on the runner.
      - name: Generate the stack's secrets
        run: pnpm stack:init

      - name: Start the stack
        run: pnpm stack:up

      - name: Stack smoke test
        run: pnpm stack:smoke

      # U4 Infrastructure Design §11 (TC-EHA-084, TC-EHA-085), on a fresh
      # stack: it makes the first authentication itself.
      - name: Restart the stack from empty volumes
        run: |
          docker compose -f deploy/local/compose.yaml down -v
          pnpm stack:up

      - name: The S1-stopped demonstration
        run: pnpm stack:outage

      # U5 (D-CG-AR-02, 03): done when 1 and the backup and restore round trip,
      # by raw calls, on a fresh stack: e2e/ makes the first authentication.
      - name: Restart the stack from empty volumes, for e2e
        run: |
          docker compose -f deploy/local/compose.yaml down -v
          pnpm stack:up

      # Vitest needs the workspace built (as the test job builds before
      # testing); this job otherwise builds only the images (D-CG-AR-24).
      - name: Build the workspace, for e2e
        run: pnpm run build

      - name: The e2e proofs (done when 1; backup and restore)
        run: pnpm test:e2e

      - name: Show the logs on failure
        if: failure()
        run: docker compose -f deploy/local/compose.yaml logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/local/compose.yaml down -v

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
