name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signature
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/soorma-ai/soorma-core/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'soorma-bot,dependabot[bot],*[bot]'
          custom-notsigned-prcomment: >
            Thank you for your contribution. Before it can be merged, please read
            and sign our [Contributor License Agreement](https://github.com/soorma-ai/soorma-core/blob/main/CLA.md).
            To sign, post a comment on this pull request containing exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
