name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla-assistant:
    # The CLA assistant records signatures by committing to
    # signatures/version1/cla.json (contents), comments on and labels the pull
    # request (pull-requests), sets the CLA commit status (statuses), and
    # re-runs its own check on a "recheck" comment (actions).
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA signature
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/soorma-ai/soorma-core/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'gnulib,soorma-bot,dependabot[bot],*[bot]'
          custom-notsigned-prcomment: >
            Thank you for your contribution. Before it can be merged, please read
            and sign our [Contributor License Agreement](https://github.com/soorma-ai/soorma-core/blob/main/CLA.md).
            To sign, post a comment on this pull request containing exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
