# SPDX-License-Identifier: FSL-1.1-ALv2
#
# Alert rules over the named security events (NFR-OI-23; P-17; SECURITY-14).
# Validated by alerts.schema.json and its test. Nothing evaluates them in M1:
# alerting and the dashboard are not applicable in M1, by the user's decision,
# and are carried to the first hosted deployment.
#
# A rule fires when `event` occurs at least `threshold.count` times within
# `threshold.windowMinutes`, counted per `groupBy` value. A human is grouped by
# log pseudonym, never by identifier (NFR-OI-22).
version: 1

# The named security events. Units add theirs here (shared-infrastructure.md).
events:
  - auth.failed
  - auth.bound_refused
  - auth.second_factor_required
  - signin.issued
  - signin.ended
  - material.changed
  - failed_attempt.dropped
  - internal.call_refused
  - config.enrollment_ignored
  # Each environment's S2 (U4 Infrastructure Design §9).
  - credential.issued
  - credential.renewed
  - credential.ended
  - credential.refused
  - grant.made
  - grant.denied
  - first_grant.applied
  - orglevel.unavailable
  - store.unavailable
  - throttle.refused
  # Each environment's S2, U5's registration operations (NFR-AR-18).
  - registration.created
  - registration.refused
  - secret.issued
  - secret.refused

rules:
  - id: auth-failed-repeated
    event: auth.failed
    groupBy: pseudonym
    threshold: { count: 5, windowMinutes: 15 }
    severity: warning
    description: Repeated failures to authenticate one human, before the bound refuses.

  - id: auth-bound-refused
    event: auth.bound_refused
    groupBy: pseudonym
    threshold: { count: 1, windowMinutes: 15 }
    severity: warning
    description: The abuse bound refused attempts for a human.

  - id: internal-call-refused
    event: internal.call_refused
    groupBy: none
    threshold: { count: 1, windowMinutes: 5 }
    severity: critical
    description: A call to the internal interface failed its signed-request check.

  - id: failed-attempt-dropped
    event: failed_attempt.dropped
    groupBy: none
    threshold: { count: 1, windowMinutes: 5 }
    severity: critical
    description: Failed Attempt records were dropped (a full queue, or a failed write).

  - id: enrollment-ignored
    event: config.enrollment_ignored
    groupBy: pseudonym
    threshold: { count: 1, windowMinutes: 60 }
    severity: info
    description: Configured enrollment material was ignored for an existing principal.

  # Each environment's S2 (U4 Infrastructure Design §9; NFR-EHA-19).
  - id: credential-refused-repeated
    event: credential.refused
    groupBy: pseudonym
    threshold: { count: 5, windowMinutes: 15 }
    severity: warning
    description: Repeated refusals of a human's environment credentials, or of issuing one.

  - id: grant-denied
    event: grant.denied
    groupBy: pseudonym
    threshold: { count: 1, windowMinutes: 15 }
    severity: warning
    description: A human was refused a grant they asked to make.

  - id: orglevel-unavailable
    event: orglevel.unavailable
    groupBy: environment
    threshold: { count: 1, windowMinutes: 5 }
    severity: critical
    description: An environment could not reach the organization level (S1), or holds no verify keys.

  - id: env-store-unavailable
    event: store.unavailable
    groupBy: environment
    threshold: { count: 1, windowMinutes: 5 }
    severity: critical
    description: An environment's store could not be read or written.

  - id: throttle-refused
    event: throttle.refused
    groupBy: environment
    threshold: { count: 1, windowMinutes: 5 }
    severity: warning
    description: An environment's S2 refused requests at its limit on concurrent calls to S1.

  # Each environment's S2, U5's registration operations (NFR-AR-19; NP-AR-07). The
  # rule format has no reason filter, so attempted escalation (ceiling_exceeded,
  # human_only_in_standing) and probing (registration_exists, unknown_registration,
  # not_sponsor_or_admin) are caught as one human's repeated refusals, and a burst
  # of one reason as a per-code rule.
  - id: registration-refused-repeated
    event: registration.refused
    groupBy: pseudonym
    threshold: { count: 5, windowMinutes: 15 }
    severity: warning
    description: Repeated refusals of one human's registrations (the ceiling, the human-only class, a taken identifier).

  - id: secret-refused-repeated
    event: secret.refused
    groupBy: pseudonym
    threshold: { count: 5, windowMinutes: 15 }
    severity: warning
    description: Repeated refusals of one human's secret issuance (not the sponsor or an Admin, an unknown registration, the cap).

  - id: registration-refused-burst
    event: registration.refused
    groupBy: code
    threshold: { count: 20, windowMinutes: 15 }
    severity: warning
    description: A burst of one registration refusal reason across the environment.
