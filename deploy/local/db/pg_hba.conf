#
# The org store's client authentication (Infrastructure Design §4, §5).
# Network connections: TLS only (hostssl), SCRAM, the two U2 roles, the org
# store's database only. The one non-network line is the superuser over the
# container's own Unix socket, by peer identity, which the image's first-start
# initialisation and its healthcheck use; it is reachable from no network.
# TYPE   DATABASE    USER                                   ADDRESS     METHOD
local    all         postgres                                           peer
hostssl  soorma_org  soorma_org_migrator,soorma_org_app     0.0.0.0/0   scram-sha-256
hostssl  soorma_org  soorma_org_migrator,soorma_org_app     ::/0        scram-sha-256
