#
# An environment store's client authentication (U4 Infrastructure Design §6),
# as the org store's. Network connections: TLS only (hostssl), SCRAM, the three
# environment roles (S3's soorma_env_data since U6, D-ID-AC-08), the
# environment store's database only. The one non-network line is the
# superuser over the container's own Unix socket, by peer identity, which the
# image's first-start initialisation and its healthcheck use; it is reachable
# from no network.
# TYPE   DATABASE    USER                                                    ADDRESS     METHOD
local    all         postgres                                                            peer
hostssl  soorma_env  soorma_env_migrator,soorma_env_app,soorma_env_data,soorma_env_ingest 0.0.0.0/0   scram-sha-256
hostssl  soorma_env  soorma_env_migrator,soorma_env_app,soorma_env_data,soorma_env_ingest ::/0        scram-sha-256
