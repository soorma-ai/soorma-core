# SPDX-License-Identifier: FSL-1.1-ALv2
#
# The local stack's organization level (Infrastructure Design §1 to §7).
#   pnpm stack:init      generate every secret into deploy/local/.secrets/
#   pnpm stack:up        build and start
#   pnpm stack:down      stop
#
# - Secrets (Infrastructure Design §3, amended: Q-CG-4 B): the files in
#   .secrets/ reach only org-secrets-init, which copies each into the
#   org-secrets volume, one subdirectory per service, owned by that service's
#   user, mode 0400. Each service mounts only its own subdirectory, read-only,
#   at /run/secrets. None passes through an environment variable. The copies
#   are removed by `pnpm stack:down -v`
# - Requires Docker Engine 26 and Compose 2.26.0 (volume subpaths); `pnpm
#   stack:up` checks both
# - S1's edge is published on the host's loopback only (127.0.0.1:8441); the
#   internal port and the store are published nowhere; health is on no network
# - org-migrate runs first, as the migrator; S1 starts only once it has
#   completed, and never holds the migrator password
# - Environments E and E2 (U4): each its own secrets volume and copier, store,
#   migrate service, network, and S2, on 127.0.0.1:8442 and 8443; S2 joins
#   org-internal-{env} and does not wait for org-gateway
# - Every container: a non-root user, a read-only root file system, all
#   capabilities dropped, no new privileges; the one exception is
#   org-secrets-init (root, only CHOWN, DAC_OVERRIDE, FOWNER; no network;
#   read-only root; it exits)
name: soorma-local

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

# The shared shape of every environment's secrets copier (the hardening
# exception, as org-secrets-init: root, only CHOWN, DAC_OVERRIDE, FOWNER; no
# network; read-only root; it exits).
x-secrets-init: &secrets-init
  image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
  user: '0:0'
  read_only: true
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
  security_opt: ['no-new-privileges:true']
  network_mode: none
  restart: 'no'

# The shared shape of every environment's one-shot backup and restore services
# (U5 NP-AR-08). Under the backup profile, so stack:up never starts them; run
# by pnpm stack:backup and stack:restore. The pinned PostgreSQL image as 999;
# the environment's network only; only its backup/ secrets subpath mounted.
# The migrator password reaches pg_dump and pg_restore only through a pgpass
# file built in /tmp (a tmpfs) from /run/secrets: PGPASSFILE, its path, is the
# only variable; never PGPASSWORD, a variable, or an argument. verify-full
# against the stack CA.
x-env-backup: &env-backup
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
  user: '999:999'
  tmpfs:
    - /tmp
  environment:
    PGPASSFILE: /tmp/pgpass
  profiles: [backup]
  restart: 'no'

# An environment store's shared shape (U4 Infrastructure Design §6).
x-env-db: &env-db
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
  user: '999:999'
  tmpfs:
    - /var/run/postgresql
    - /tmp
  healthcheck:
    test: ['CMD', 'pg_isready', '-q', '-h', '/var/run/postgresql', '-d', 'soorma_env']
    interval: 2s
    timeout: 2s
    retries: 30
  restart: unless-stopped

# An environment's S2 (U4 Infrastructure Design §1, §8). It does not wait for
# org-gateway: it starts without S1 (P-01; D-EHA-23).
x-control-gateway: &control-gateway
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  image: soorma/control-gateway:local
  command: ['dist/main.js']
  configs:
    - { source: tenancy, target: /etc/soorma/tenancy.yaml }
  tmpfs:
    - /tmp
  mem_limit: 256m
  healthcheck:
    test: ['CMD', '/nodejs/bin/node', 'dist/healthcheck.js']
    interval: 5s
    timeout: 3s
    retries: 24
  restart: unless-stopped

services:
  # The organization level's one-shot secrets copy (Q-CG-4 B). It alone sees
  # this level's secret files, and only this level's.
  org-secrets-init:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ['no-new-privileges:true']
    network_mode: none
    entrypoint: ['sh', '/soorma/secrets-init/org.sh']
    volumes:
      - ./secrets-init/org.sh:/soorma/secrets-init/org.sh:ro
      - org-secrets:/out
    secrets:
      - stack-ca-cert
      - org-gateway-tls
      - org-db-tls
      - org-db-superuser-password
      - org-db-app-password
      - org-db-migrator-password
      - org-signing-key
      - org-seed-key
      - org-counter-secret
      - org-log-pseudonym-key
      - org-enrollment-1
      # The one value that crosses levels: each environment's caller PUBLIC key,
      # for org-gateway's internalCallers (U4 Infrastructure Design §3).
      - e-caller-public-key
      - e2-caller-public-key
    restart: 'no'

  org-db:
    <<: *hardening
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    user: '999:999'
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - ssl_cert_file=/run/secrets/org-db-tls
      - -c
      - ssl_key_file=/run/secrets/org-db-tls
      - -c
      - hba_file=/soorma/db/pg_hba.conf
      - -c
      - synchronous_commit=on
    environment:
      POSTGRES_DB: soorma_org
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/org-db-superuser-password
    volumes:
      - {
          type: volume,
          source: org-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: org-db },
        }
      - org-db-data:/var/lib/postgresql
      - ./db/roles.sql:/soorma/db/roles.sql:ro
      - ./db/pg_hba.conf:/soorma/db/pg_hba.conf:ro
      - ./db/init/10-soorma-roles.sh:/docker-entrypoint-initdb.d/10-soorma-roles.sh:ro
    tmpfs:
      - /var/run/postgresql
      - /tmp
    networks:
      org:
        aliases: [org-db.soorma.internal]
    depends_on:
      org-secrets-init: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-h', '/var/run/postgresql', '-d', 'soorma_org']
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  org-migrate:
    <<: *hardening
    image: soorma/org-gateway:local
    build:
      context: ../..
      dockerfile: services/org-gateway/Dockerfile
    command: ['dist/migrate.js']
    volumes:
      - {
          type: volume,
          source: org-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: org-migrate },
        }
    configs:
      - { source: tenancy, target: /etc/soorma/tenancy.yaml }
    networks: [org]
    depends_on:
      org-secrets-init: { condition: service_completed_successfully }
      org-db: { condition: service_healthy }
    restart: 'no'

  org-gateway:
    <<: *hardening
    image: soorma/org-gateway:local
    command: ['dist/main.js']
    environment:
      SOORMA_HEALTH_PORT: '8080'
    volumes:
      - {
          type: volume,
          source: org-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: org-gateway },
        }
    configs:
      - { source: tenancy, target: /etc/soorma/tenancy.yaml }
    tmpfs:
      - /tmp
    mem_limit: 768m
    ports:
      - '127.0.0.1:8441:8443'
    networks:
      org: {}
      org-internal-e:
        aliases: [org-gateway.soorma.internal]
      org-internal-e2:
        aliases: [org-gateway.soorma.internal]
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', 'dist/healthcheck.js']
      interval: 5s
      timeout: 3s
      retries: 24
    depends_on:
      org-secrets-init: { condition: service_completed_successfully }
      org-migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # ---- Environment e (U4 Infrastructure Design; Q1 A: written out in full) ----

  # Environment e's one-shot secrets copy: it alone sees e's secret files.
  e-secrets-init:
    <<: *secrets-init
    entrypoint: ['sh', '/soorma/secrets-init/env.sh', 'e']
    volumes:
      - ./secrets-init/env.sh:/soorma/secrets-init/env.sh:ro
      - e-secrets:/out
    secrets:
      - stack-ca-cert
      - e-control-gateway-tls
      - e-db-tls
      - e-db-superuser-password
      - e-db-app-password
      - e-db-migrator-password
      - e-db-data-password
      - e-signing-key-1
      - e-caller-key
      - e-log-pseudonym-key

  e-db:
    <<: *env-db
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - ssl_cert_file=/run/secrets/e-db-tls
      - -c
      - ssl_key_file=/run/secrets/e-db-tls
      - -c
      - hba_file=/soorma/db/env-pg_hba.conf
      - -c
      - synchronous_commit=on
    environment:
      POSTGRES_DB: soorma_env
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/e-db-superuser-password
      SOORMA_ENVIRONMENT: e
    volumes:
      - {
          type: volume,
          source: e-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: db },
        }
      - e-db-data:/var/lib/postgresql
      - ./db/env-roles.sql:/soorma/db/env-roles.sql:ro
      - ./db/env-pg_hba.conf:/soorma/db/env-pg_hba.conf:ro
      - ./db/init/10-soorma-env-roles.sh:/docker-entrypoint-initdb.d/10-soorma-env-roles.sh:ro
    networks:
      e:
        aliases: [env-db.e.soorma.internal]
    depends_on:
      e-secrets-init: { condition: service_completed_successfully }

  e-migrate:
    <<: *hardening
    image: soorma/control-gateway:local
    build:
      context: ../..
      dockerfile: services/control-gateway/Dockerfile
    command: ['dist/migrate.js']
    environment:
      SOORMA_PROJECT: p1
      SOORMA_ENVIRONMENT: e
    volumes:
      - {
          type: volume,
          source: e-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: migrate },
        }
    configs:
      - { source: tenancy, target: /etc/soorma/tenancy.yaml }
    networks: [e]
    depends_on:
      e-secrets-init: { condition: service_completed_successfully }
      e-db: { condition: service_healthy }
    restart: 'no'

  e-control-gateway:
    <<: *control-gateway
    environment:
      SOORMA_PROJECT: p1
      SOORMA_ENVIRONMENT: e
      SOORMA_HEALTH_PORT: '8080'
    volumes:
      - {
          type: volume,
          source: e-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: control-gateway },
        }
    ports:
      - '127.0.0.1:8442:8443'
    networks:
      e:
        aliases: [control-gateway.e.soorma.internal]
      org-internal-e: {}
    depends_on:
      e-secrets-init: { condition: service_completed_successfully }
      e-migrate: { condition: service_completed_successfully }

  # e's backup (U5 NP-AR-08): a custom-format dump to stdout, diagnostics to
  # stderr only. Run with `docker compose run --rm -T`, so no terminal alters it.
  e-backup:
    <<: *env-backup
    entrypoint:
      - sh
      - -ec
      - |
        umask 077
        { printf '%s' 'env-db.e.soorma.internal:5432:soorma_env:soorma_env_migrator:'; sed -e 's/\\/\\\\/g' -e 's/:/\\:/g' /run/secrets/e-db-migrator-password; } > /tmp/pgpass
        exec pg_dump --format=custom --no-password 'host=env-db.e.soorma.internal port=5432 dbname=soorma_env user=soorma_env_migrator sslmode=verify-full sslrootcert=/run/secrets/stack-ca-cert'
    volumes:
      - {
          type: volume,
          source: e-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: backup },
        }
    networks: [e]

  # e's restore: refuses a database that is not empty, then restores the
  # archive on stdin in one transaction, stopping at the first error.
  e-restore:
    <<: *env-backup
    entrypoint:
      - sh
      - -ec
      - |
        umask 077
        { printf '%s' 'env-db.e.soorma.internal:5432:soorma_env:soorma_env_migrator:'; sed -e 's/\\/\\\\/g' -e 's/:/\\:/g' /run/secrets/e-db-migrator-password; } > /tmp/pgpass
        n=$$(psql --no-password --no-psqlrc -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace s ON s.oid = c.relnamespace WHERE s.nspname = 'public'" 'host=env-db.e.soorma.internal port=5432 dbname=soorma_env user=soorma_env_migrator sslmode=verify-full sslrootcert=/run/secrets/stack-ca-cert')
        if [ "$$n" != 0 ]; then echo 'restore: the database is not empty' >&2; exit 3; fi
        exec pg_restore --exit-on-error --single-transaction --no-password --dbname='host=env-db.e.soorma.internal port=5432 dbname=soorma_env user=soorma_env_migrator sslmode=verify-full sslrootcert=/run/secrets/stack-ca-cert'
    volumes:
      - {
          type: volume,
          source: e-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: backup },
        }
    networks: [e]

  # ---- Environment e2 (U4 Infrastructure Design; Q1 A: written out in full) ----

  # Environment e2's one-shot secrets copy: it alone sees e2's secret files.
  e2-secrets-init:
    <<: *secrets-init
    entrypoint: ['sh', '/soorma/secrets-init/env.sh', 'e2']
    volumes:
      - ./secrets-init/env.sh:/soorma/secrets-init/env.sh:ro
      - e2-secrets:/out
    secrets:
      - stack-ca-cert
      - e2-control-gateway-tls
      - e2-db-tls
      - e2-db-superuser-password
      - e2-db-app-password
      - e2-db-migrator-password
      - e2-db-data-password
      - e2-signing-key-1
      - e2-caller-key
      - e2-log-pseudonym-key

  e2-db:
    <<: *env-db
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - ssl_cert_file=/run/secrets/e2-db-tls
      - -c
      - ssl_key_file=/run/secrets/e2-db-tls
      - -c
      - hba_file=/soorma/db/env-pg_hba.conf
      - -c
      - synchronous_commit=on
    environment:
      POSTGRES_DB: soorma_env
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/e2-db-superuser-password
      SOORMA_ENVIRONMENT: e2
    volumes:
      - {
          type: volume,
          source: e2-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: db },
        }
      - e2-db-data:/var/lib/postgresql
      - ./db/env-roles.sql:/soorma/db/env-roles.sql:ro
      - ./db/env-pg_hba.conf:/soorma/db/env-pg_hba.conf:ro
      - ./db/init/10-soorma-env-roles.sh:/docker-entrypoint-initdb.d/10-soorma-env-roles.sh:ro
    networks:
      e2:
        aliases: [env-db.e2.soorma.internal]
    depends_on:
      e2-secrets-init: { condition: service_completed_successfully }

  e2-migrate:
    <<: *hardening
    image: soorma/control-gateway:local
    command: ['dist/migrate.js']
    environment:
      SOORMA_PROJECT: p1
      SOORMA_ENVIRONMENT: e2
    volumes:
      - {
          type: volume,
          source: e2-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: migrate },
        }
    configs:
      - { source: tenancy, target: /etc/soorma/tenancy.yaml }
    networks: [e2]
    depends_on:
      e2-secrets-init: { condition: service_completed_successfully }
      e2-db: { condition: service_healthy }
      e-migrate: { condition: service_completed_successfully }
    restart: 'no'

  e2-control-gateway:
    <<: *control-gateway
    environment:
      SOORMA_PROJECT: p1
      SOORMA_ENVIRONMENT: e2
      SOORMA_HEALTH_PORT: '8080'
    volumes:
      - {
          type: volume,
          source: e2-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: control-gateway },
        }
    ports:
      - '127.0.0.1:8443:8443'
    networks:
      e2:
        aliases: [control-gateway.e2.soorma.internal]
      org-internal-e2: {}
    depends_on:
      e2-secrets-init: { condition: service_completed_successfully }
      e2-migrate: { condition: service_completed_successfully }

  # e2's backup (U5 NP-AR-08): a custom-format dump to stdout, diagnostics to
  # stderr only. Run with `docker compose run --rm -T`, so no terminal alters it.
  e2-backup:
    <<: *env-backup
    entrypoint:
      - sh
      - -ec
      - |
        umask 077
        { printf '%s' 'env-db.e2.soorma.internal:5432:soorma_env:soorma_env_migrator:'; sed -e 's/\\/\\\\/g' -e 's/:/\\:/g' /run/secrets/e2-db-migrator-password; } > /tmp/pgpass
        exec pg_dump --format=custom --no-password 'host=env-db.e2.soorma.internal port=5432 dbname=soorma_env user=soorma_env_migrator sslmode=verify-full sslrootcert=/run/secrets/stack-ca-cert'
    volumes:
      - {
          type: volume,
          source: e2-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: backup },
        }
    networks: [e2]

  # e2's restore: refuses a database that is not empty, then restores the
  # archive on stdin in one transaction, stopping at the first error.
  e2-restore:
    <<: *env-backup
    entrypoint:
      - sh
      - -ec
      - |
        umask 077
        { printf '%s' 'env-db.e2.soorma.internal:5432:soorma_env:soorma_env_migrator:'; sed -e 's/\\/\\\\/g' -e 's/:/\\:/g' /run/secrets/e2-db-migrator-password; } > /tmp/pgpass
        n=$$(psql --no-password --no-psqlrc -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace s ON s.oid = c.relnamespace WHERE s.nspname = 'public'" 'host=env-db.e2.soorma.internal port=5432 dbname=soorma_env user=soorma_env_migrator sslmode=verify-full sslrootcert=/run/secrets/stack-ca-cert')
        if [ "$$n" != 0 ]; then echo 'restore: the database is not empty' >&2; exit 3; fi
        exec pg_restore --exit-on-error --single-transaction --no-password --dbname='host=env-db.e2.soorma.internal port=5432 dbname=soorma_env user=soorma_env_migrator sslmode=verify-full sslrootcert=/run/secrets/stack-ca-cert'
    volumes:
      - {
          type: volume,
          source: e2-secrets,
          target: /run/secrets,
          read_only: true,
          volume: { subpath: backup },
        }
    networks: [e2]

networks:
  org: {}
  # One internal network per environment: environments share no network.
  org-internal-e: {}
  org-internal-e2: {}
  # Each environment's own network: its store, migrate service, and S2.
  e: {}
  e2: {}

volumes:
  org-db-data: {}
  # The organization level's secrets volume: one subdirectory per service.
  # Each environment that U4 adds gets its own ({env}-secrets).
  org-secrets: {}
  # Each environment's database and secrets volume (U4 Infrastructure Design §3, §6).
  e-db-data: {}
  e2-db-data: {}
  e-secrets: {}
  e2-secrets: {}

configs:
  tenancy:
    file: ./config/tenancy.yaml

secrets:
  stack-ca-cert: { file: ./.secrets/stack-ca-cert }
  org-gateway-tls: { file: ./.secrets/org-gateway-tls }
  org-db-tls: { file: ./.secrets/org-db-tls }
  org-db-superuser-password: { file: ./.secrets/org-db-superuser-password }
  org-db-app-password: { file: ./.secrets/org-db-app-password }
  org-db-migrator-password: { file: ./.secrets/org-db-migrator-password }
  org-signing-key: { file: ./.secrets/org-signing-key }
  org-seed-key: { file: ./.secrets/org-seed-key }
  org-counter-secret: { file: ./.secrets/org-counter-secret }
  org-log-pseudonym-key: { file: ./.secrets/org-log-pseudonym-key }
  org-enrollment-1: { file: ./.secrets/org-enrollment-1 }
  e-control-gateway-tls: { file: ./.secrets/e-control-gateway-tls }
  e-db-tls: { file: ./.secrets/e-db-tls }
  e-db-superuser-password: { file: ./.secrets/e-db-superuser-password }
  e-db-app-password: { file: ./.secrets/e-db-app-password }
  e-db-migrator-password: { file: ./.secrets/e-db-migrator-password }
  e-db-data-password: { file: ./.secrets/e-db-data-password }
  e-signing-key-1: { file: ./.secrets/e-signing-key-1 }
  e-caller-key: { file: ./.secrets/e-caller-key }
  e-caller-public-key: { file: ./.secrets/e-caller-public-key }
  e-log-pseudonym-key: { file: ./.secrets/e-log-pseudonym-key }
  e2-control-gateway-tls: { file: ./.secrets/e2-control-gateway-tls }
